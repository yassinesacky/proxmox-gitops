- name: Configure Terraform LXC
  hosts: LXC
  become: true

  tasks:
    - name: Test connectivity
      ansible.builtin.ping:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - python3
          - python3-pip
          - curl
          - git
          - vim
          - wget
        state: present    