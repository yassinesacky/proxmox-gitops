name: Terraform CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  
  schedule:
    - cron: "20 20 16 9 *"    

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform


    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Check Terraform Version
        run: terraform version

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check Tailscale
        run: tailscale status

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  ansible:
    runs-on: ubuntu-latest
    needs: terraform

    defaults:
      run:
        working-directory: ansible

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: pip install ansible

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci


      - name: Configure SSH known hosts
        env:
          ANSIBLE_KNOWN_HOSTS: ${{ secrets.ANSIBLE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ANSIBLE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts    
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" > ~/.ssh/ansible_proxmox
          chmod 600 ~/.ssh/ansible_proxmox
    
      - name: Test Ansible connectivity
        run: |
          if ssh-keygen -F 192.168.1.158 -f ~/.ssh/known_hosts > /dev/null; then
            echo "Host entry FOUND"
          else
            echo "Host entry MISSING or incorrectly formatted"
            exit 1
          fi
          ansible all -i inventory.ini -m ping

      - name: Run Ansible playbook
        run: ansible-playbook -i inventory.ini playbook.yml
